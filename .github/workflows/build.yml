name: build

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mechanical floor for the documentation standard (CONTRIBUTING.md):
      # SPDX + file-header presence, doc comments on public header prototypes.
      - name: Documentation lint
        run: python3 scripts/docs_lint.py

      - name: Build & run control-core unit tests (native gcc)
        run: |
          gcc -std=c11 -Wall -Wextra -I control/Inc \
            control/Src/*.c control/test/*.c \
            -lm -o control_tests
          ./control_tests

  sil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run SIL plant-simulation gauntlet (PROJECT_PLAN §8.1)
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -I control/Inc -I sim \
            control/Src/*.c sim/*.c \
            -lm -o sil_tests
          ./sil_tests

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Fetch HAL/CMSIS (STM32CubeF0, pinned)
        run: sh scripts/fetch_deps.sh

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build
        run: cmake --build build -j

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ws500-openfw
          path: |
            build/ws500-openfw.elf
            build/ws500-openfw.bin
            build/ws500-openfw.map

  # Whole-firmware emulation — boots ws500-openfw.elf on an emulated STM32F072RB
  # in Renode and asserts the 10 ms control loop iterates (PROJECT_PLAN §8.2,
  # issue #25). See renode/README.md. Runs on the host runner (Node available
  # for checkout/artifacts) with the pinned portable Renode release, which ships
  # renode-test. Does not touch the tests/sil/firmware jobs above.
  emulation:
    needs: firmware
    runs-on: ubuntu-latest
    env:
      RENODE_VERSION: 1.16.1
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware ELF (built by the firmware job)
        uses: actions/download-artifact@v4
        with:
          name: ws500-openfw
          path: build

      - name: Install Renode (pinned portable release)
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          mkdir -p "$HOME/renode"
          tar xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Install renode-test Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install robotframework
          if [ -f "$HOME/renode/tests/requirements.txt" ]; then
            python3 -m pip install -r "$HOME/renode/tests/requirements.txt"
          fi

      # Runs every case in the file: whole-firmware liveness (§8.2) and the
      # §7 R3 fault path — induced fault -> safe state -> crash record ->
      # clean reboot (the M3 exit criterion). See renode/README.md.
      - name: Renode whole-firmware tests (PROJECT_PLAN §8.2, §7 R3)
        run: renode-test renode/ws500.robot
